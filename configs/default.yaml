logging:
  level: INFO
  jsonl_events: true

io:
  sampling_rate: &sr 5.0
  image_globs: ["*.png", "*.jpg", "*.jpeg"]
  track_glob: "*.npy"
  table_globs: ["*.csv", "*.tsv", "*.xls", "*.xlsx"]

heatmap:
  table_mode: auto
  lower: -1e20
  upper: 1e16
  binarize: true
  origin: lower
  cmap: plasma
  area:
    binarize: false
    cmap: plasma
    vmin: null
    vmax: null

image_input:
  grayscale: true
  target_width: null
  target_height: null
  low_hex: null
  high_hex: null
  invert: false
  alpha_background: "#000000"

analysis:
  mode: standard
  ripple:
    min_track_rows: 30
    min_abs_slope: 0.05
    max_line_rmse_px: 12.0
    extraction:
      enabled: true
      max_tracks: 500
      min_abs_slope: 0.22
      max_abs_slope: 1.2
      temporal_sigma_rows: 2.0
      peak_min_distance_px: 12
      min_phase_contrast: 0.025
      dedupe:
        allow_cross_phase: true
        min_overlap_rows: 35
        min_overlap_fraction: 0.45
        min_partial_overlap_rows: 18
        min_short_overlap_fraction: 0.55
        max_slope_delta: 0.35
        max_median_distance_px: 6.0
        max_p90_distance_px: 10.0
        min_spatial_overlap_rows: 12
        close_distance_px: 7.0
        min_close_fraction: 0.68
        partial_max_median_distance_px: 7.0
        cross_phase_max_median_distance_px: 4.0
        cross_phase_max_p90_distance_px: 7.0
        cross_phase_min_spatial_overlap_rows: 16
        cross_phase_close_distance_px: 5.0
        cross_phase_min_close_fraction: 0.75
        cross_phase_partial_max_median_distance_px: 5.0
    endpoint_link:
      prefer_long_linear: true
      length_weight: 0.25
      linearity_weight: 0.25
      min_abs_slope: 0.05
    family:
      min_tracks: 2
      max_angle_delta_deg: 10.0
      min_x_overlap_px: 30.0
      min_x_overlap_fraction: 0.15
      max_reference_gap_frames: 300.0
    frequency:
      sample_count: 25
      min_period_frames: 3.0
      max_period_frames: 300.0
      max_gap_cv: 0.75
  large_wave:
    extraction:
      enabled: true
      normalize_percentiles: [1.0, 99.0]
      spatial_sigma_fraction: 0.02
      min_spatial_sigma_px: 12.0
      max_spatial_sigma_px: 36.0
      temporal_sigma_rows: 2.0
      background_sigma_px: null
      prominence: 0.01
      peak_min_distance_px: null
      response_percentile: 99.5
      min_component_rows: 50
      min_component_support_fraction: 0.65
      min_track_rows: 50
      track_smoothing_sigma_rows: 1.25
      max_tracks: 150
      intensity_bias:
        enabled: true
        strength: 0.65
        min_prominence_factor: 0.65
        max_prominence_factor: 1.60
        selection_weight: 0.75
      ensemble:
        enabled: true
        cusp_spatial_sigma_ratio: 0.35
        min_spatial_sigma_px: 6.0
        max_spatial_sigma_px: 16.0
        temporal_sigma_rows: 1.0
        prominence: 0.012
        peak_min_distance_px: null
        max_step_dx_px_per_row: 12.0
        min_track_rows: 80
        cusp_half_window_rows: 16
        min_cusp_arm_displacement_px: 5.0
        dedupe_min_overlap_rows: 30
        dedupe_max_distance_px: 8.0
        dedupe_min_close_fraction: 0.65
        dedupe_min_broad_coverage: 0.35
        conflicts:
          min_overlap_rows: 12
          max_overlap_distance_px: 3.0
          min_close_fraction: 0.60
          min_close_run_rows: 8
          intersection_tolerance_px: 0.5
      endpoint_bridge:
        max_gap_rows: 40
        min_bridge_response: 0.01
        max_conflict_fraction: 0.05
        max_turn_deg: 150.0
        max_curvature_px_per_row2: 1.0
        max_chord_slope_px_per_row: 2.0
        max_step_dx_px_per_row: 4.0
        max_manifest_rejections: 250
    endpoint_link:
      prefer_smooth_curves: true
      length_weight: 0.30
      tangent_weight: 0.25
      curvature_weight: 0.35
      max_turn_deg: 120.0
      max_curvature_px_per_row2: 0.35
    peaks:
      event_polarity: both
      adaptive: false
      minimum_per_track: 0
      prominence: 3.0
      width: 5
      distance: 30
      smoothing_sigma_rows: 3.0
    events:
      min_tracks: 2
      max_peak_frame_gap: 20.0
      min_amplitude_px: 3.0
      min_prominence_px: 2.0
      min_width_frames: 5.0
      curvature_half_window_rows: 8
      fit_window_width_multiplier: 1.0
      fit_boundary_smoothing_sigma_rows: 4.0
      endpoint_anchor_rows: 7
      max_period_boundary_error_fraction: 0.5

detrend:
  degree: 1
  min_samples: 0.5
  residual_threshold: null
  random_state: 42

peaks:
  event_polarity: both
  adaptive: false
  minimum_per_track: 1
  prominence: 2.0
  width: 1
  distance: 8
  cross_polarity_min_distance: 12
  cross_polarity_policy: stronger

period:
  sampling_rate: *sr
  min_freq: 0.02
  max_freq: 2.0

viz:
  enabled: true
  per_track:
    detrended_with_peaks: true
    spectrum: true
  summary:
    histograms: true
  wave_windows:
    save: true
    max_per_track: 50
    stride: 1
  hist_bins: 20
  dpi: 180

features:
  fit_target: raw_wave
  compare_fit_targets: true
  fit_window_period_frac: 0.5
  classify:
    ripple_max_deg: 10
    surf_min_deg: 20
    prominence_min_px: 1.0

service:
  partial_every_tracks: 250
  write_progress_every_secs: 10
  overlay:
    write_every_tracks: 1
    format: ndjson
  resume:
    enabled: true
    marker_dir: "output/processed"
    progress_file: "progress.json"
    safe_skip: true
  retention:
    enabled: false
    keep_last_runs: 20
    max_run_age_days: null
  artifacts:
    write_run_json: true
    write_events_ndjson: true

kymo:
  backend: onnx

  onnx:
    export_dir: null
    seg_size: 256
    force_mode: bi
    fuse_uni_into_bi: true
    fuse_uni_weight: 0.6

    thresholds:
      thr_default: 0.20
      thr_bi: 0.19
      thr_uni: 0.20
    auto_threshold:
      enabled: true
      sweep: [0.12, 0.30, 19]
      target_mask_pct: [15.0, 25.0]
      trigger_pct: [5.0, 35.0]
    hysteresis:
      enabled: true
      low: 0.09
      high: 0.18

    morphology:
      mode: directional
      directional:
        kv: 4
        kh: 4
        diag_bridge: false
      classic:
        kernel: 3

    components:
      min_px: 9
      min_rows: 7

    skeleton:
      method: thin
      prune_iters: 1
      keep_ratio: 0.65
      keep_min_px: 2500
      prob_floor_min: 0.09
      prob_floor_max: 0.10

    tracking:
      min_length: 50
      max_branch_steps: 256
      decision_recent_tail: 16

    postproc:
      extend_rows: 22
      dx_win: 4
      prob_min: 0.12
      max_gap_rows: 11
      max_dx: 5
      prob_bridge_min: 0.12
      endpoint_link:
        enabled: true
        max_gap_rows: 60
        max_dx: 10.0
        min_bridge_prob: 0.075
        max_slope_delta: 0.7
        fit_rows: 16
        max_conflict_fraction: 0.15
        insert_bridge_points: true
        overlap_enabled: true
        min_overlap_rows: 5
        max_overlap_rows: 45
        overlap_dx_tol: 3.0
        max_chord_slope_px_per_row: 2.0
        max_step_dx_px_per_row: 4.0
        max_manifest_rejections: 500
      dedupe:
        enabled: true
        min_rows: 30
        min_score: 0.12
        overlap_iou: 0.85
        dx_tol: 2.0

    debug:
      save_debug_images: true
      save_overlay_tracks: true

  wolfram:
    scripts_dir: kymobutler_scripts
    executable: wolframscript
    script_name: Run_Kymobutler.wls
    min_length: 30
    verbose: false
