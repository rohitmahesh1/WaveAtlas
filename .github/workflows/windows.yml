name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-distribution]
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'desktop/**'
      - 'scripts/*desktop*'
      - 'scripts/build-windows.ps1'
      - 'tests/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'desktop/*.lock'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install Rust target
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Build and test unsigned candidate
        shell: pwsh
        run: ./scripts/build-windows.ps1 -FetchModels
      - name: Upload installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: WaveAtlas-windows-x64-unsigned
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            desktop/build-manifest.json
            desktop/THIRD_PARTY_NOTICES.txt
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            desktop/build/check-workspace/logs/
            desktop/build/payload/warn-payload.txt
